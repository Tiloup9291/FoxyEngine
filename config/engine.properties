# Java 3D Engine v1.0 - Playable demo
# Pure JDK software renderer, animated robot, levels, audio, FX.
#
# Controls:
#   ZQSD/WASD = move robot | SPACE = jump | mouse = look
#   G = explosion | N = next level | M = model | C = camera | R = respawn
#   V = wire/solid | T = profiler | ESC/P = pause | F = mouse capture
#
# Launch: gradlew.bat run (or ./gradlew run)
# Config: config/engine.properties | Levels: assets/levels/*.lvl
# Design: ENGINE_DESIGN.md | Docs: see javadoc of engine.* packages
# Window size
engine.window.width=800
engine.window.height=600
engine.window.title=Java 3D Engine v1.0
# Target rate: 0 = unlimited, max 120
engine.fps.target=60
# Fixed logic tick (Hz): 0 = one variable tick per frame, max 240
engine.tick.rate=60
# Render: solid | wireframe
engine.render.mode=solid
engine.render.fov=70
engine.render.near=0.1
engine.render.far=100
engine.render.clear=0x101418
engine.render.cube=0x4DA3FF
engine.render.wire=0x00FF88
# OBJ model in assets/models (no extension) + scale
engine.model.id=cube
engine.model.scale=0.8
# Camera: orbit | fps + speeds
engine.camera.mode=orbit
engine.camera.move_speed=3.0
engine.camera.rot_speed=1.6
# Directional light (vector TOWARD the light) + ambient
engine.light.dir_x=0.4
engine.light.dir_y=0.8
engine.light.dir_z=0.6
engine.light.intensity=1.0
engine.light.color=0xFFFFFF
engine.light.ambient=0.25
# Textures: nearest | bilinear
engine.texture.filter=bilinear
# Parallel raster bands (1 = single-thread)
engine.pipeline.bands=4
# Mouse sensitivity (rad/px), wheel zoom, initial capture
engine.input.mouse_sensitivity=0.0035
engine.input.wheel_zoom=0.6
engine.input.mouse_captured=true
# Physics: gravity Y, ground plane, player speed, jump impulse
engine.physics.gravity_y=-9.81
engine.physics.ground_y=0
engine.player.speed=4
engine.player.jump=5
# Audio: enabled, master volume, spatial range (m)
engine.audio.enabled=true
engine.audio.master=0.8
engine.audio.max_dist=18
# Discrete LOD (8/20 m) + profiler HUD (T)
engine.lod.enabled=true
engine.profiler.enabled=true


